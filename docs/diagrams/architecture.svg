<text x="30" y="815" fill="#252726" font-size="13" font-weight="700" text-anchor="start">What crosses the seam:</text>
<text x="30" y="835" fill="#252726" font-size="12" font-weight="400" text-anchor="start">① StatusChanged (delivered) → FeedbackInviteObserver → FeedbackFacade.create_invites</text>
<text x="30" y="853" fill="#252726" font-size="12" font-weight="400" text-anchor="start">② ResponseReceived → FeedbackOutcomeApplier → RequestsFacade.perform(close | reopen)</text>
<text x="30" y="871" fill="#252726" font-size="12" font-weight="400" text-anchor="start">③ MetricsService reads both facades. In Assignment 2 events become Pub/Sub messages and facades become HTTP APIs.</text>
