<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AV Desk{% endblock %} · Audiovisual BRASA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/avdesk.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('public.landing') }}"><span>BRASA</span> AV Desk</a>
    <nav>{% block nav %}{% endblock %}</nav>
  </header>
  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<p class="flash flash-{{ category }}">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
